name: GAS tests

# Runs both committed Apps Script backend test suites (scripts/gas/tests and
# scripts/gas-v2/tests) on every push and PR. Additive and independent: does not
# touch ci.yml, deploy-web.yml, or deploy-qr.yml. Neither suite has npm
# dependencies (Node's built-in test runner), so there is no install step.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-gas:
    name: Test Apps Script backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        # Node 22: the `node --test` glob (scripts/gas/tests/**/*.test.js) needs
        # Node 21+, so this job is intentionally not pinned to the repo's Node 20.
        with:
          node-version: 22

      - name: Run V1 GAS test suite
        run: pnpm test:gas

      # The V2 backend is a separate project (scripts/gas-v2) with its own suite. It
      # runs as its own step so a failure names which backend broke, and so the V1
      # suite keeps running unchanged while both exist.
      - name: Run V2 GAS test suite
        run: pnpm test:gas-v2
