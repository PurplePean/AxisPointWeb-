name: Deploy — axispoint.llc

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dangerous_clean_slate:
        description: 'Wipe the remote directory before deploying — DESTRUCTIVE, cutover-only. Do not enable for routine deploys.'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Build & deploy web app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @axispoint/web run build
        env:
          VITE_V2_SUBMISSION_ENDPOINT: ${{ secrets.V2_SUBMISSION_ENDPOINT }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/dist/
          server-dir: ./public_html/
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.dangerous_clean_slate == true }}
