name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @axispoint/web run build
        env:
          VITE_FORM_ENDPOINT: ''

      - name: Build QR app
        run: pnpm --filter @axispoint/qr run build
        env:
          VITE_FORM_ENDPOINT: ''
