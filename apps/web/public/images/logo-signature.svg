    AxisPoint mark — email signature variant.
    Geometry copied exactly from AxisPointMark.dc.html (design@2026-07-30):
    same viewBox (0 0 64 85.45), same translate(-17.44 -11.66) group transform,
    same eight shapes in the same order, fullcolor palette.

    This file is the logo asset for outgoing email signatures. It is hosted at
    https://axispoint.llc/images/logo-signature.svg and referenced by the
    signature HTML files in docs/signatures/. It must be manually uploaded to the
