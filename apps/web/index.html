<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Cormorant Garamond + Figtree -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Figtree:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta name="description" content="AxisPoint is a commercial property management firm in Texas. We run the day to day for owners, with asset management and investor services when they fit." />
    <meta name="theme-color" content="#38285D" />

    <!-- Open Graph — homepage sharing (og:image tracked separately, needs a real asset) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AxisPoint Partners" />
    <meta property="og:title" content="AxisPoint Partners" />
    <meta property="og:description" content="AxisPoint is a commercial property management firm in Texas. We run the day to day for owners, with asset management and investor services when they fit." />
    <meta property="og:url" content="https://axispoint.llc/" />

    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "AxisPoint Partners",
      "description": "Commercial property management firm based in Houston, Texas. Property management, asset management, and investor services for owners statewide.",
      "url": "https://axispoint.llc",
      "email": "info@axispoint.llc",
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Houston",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "areaServed": {
        "@type": "State",
        "name": "Texas"
      },
      "knowsAbout": [
        "Commercial property management",
        "Asset management",
        "Investor services",
        "Real estate"
      ]
    }
    </script>

    <!-- Structured data: FAQPage — /property-management -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How long does a management transition take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on the property and the outgoing manager, but the plan is written before the start date: staffing, systems, banking, vendor records, and resident or tenant communication each have an owner and a date."
          }
        },
        {
          "@type": "Question",
          "name": "Who will actually be answering for my property?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A partner. Zachary Russell and Ethaniel Vu stay close enough to the work to know the property by name, and ownership is not routed through an account layer to reach them."
          }
        },
        {
          "@type": "Question",
          "name": "What does reporting look like month to month?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A consistent package on a consistent schedule, with a written narrative that explains the variances rather than leaving ownership to interpret the numbers alone."
          }
        },
        {
          "@type": "Question",
          "name": "Can you take on a property with deferred problems?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Deferred maintenance, unresolved capital work, and staffing gaps are common reasons owners call. The proposal states what gets addressed first and in what order."
          }
        }
      ]
    }
    </script>

    <title>AxisPoint Partners</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
